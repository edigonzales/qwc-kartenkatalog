name: QWC image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qwc-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm run setup
      - run: npm test && npm run lint:catalog
      - run: bash -n scripts/up.sh scripts/down.sh && bash scripts/test-scripts.sh && node --test scripts/dev.test.cjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: qwc-kartenkatalog:ci
          platforms: linux/amd64
          build-args: |
            VERSION=0.1.${{ github.run_number }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start real JVM backend and built QWC
        env:
          QWC_IMAGE: qwc-kartenkatalog:ci
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.local.yaml config --quiet
          docker compose pull kartenkatalog
          docker compose up -d --no-build --pull never --wait --wait-timeout 180
          python3 scripts/smoke.py
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down
  publish:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            sogis/qwc-kartenkatalog:latest
            sogis/qwc-kartenkatalog:0.1.${{ github.run_number }}
            sogis/qwc-kartenkatalog:sha-${{ github.sha }}
          build-args: |
            VERSION=0.1.${{ github.run_number }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "sogis/qwc-kartenkatalog@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
